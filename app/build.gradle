plugins {
    id 'com.android.application'
}

android {
    namespace 'it.edilmilan.clienti'
    compileSdk 35

    defaultConfig {
        applicationId 'it.edilmilan.clienti'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    def signingStoreFile = System.getenv('SIGNING_STORE_FILE')
    def signingKeyAlias = System.getenv('SIGNING_KEY_ALIAS')
    def signingStorePassword = System.getenv('SIGNING_STORE_PASSWORD')
    def signingKeyPassword = System.getenv('SIGNING_KEY_PASSWORD')

    signingConfigs {
        if (signingStoreFile && signingKeyAlias && signingStorePassword && signingKeyPassword) {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
