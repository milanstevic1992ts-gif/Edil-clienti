name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EDIL-Clienti-1.2.0-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EDIL-Clienti-1.2.0-debug
          path: EDIL-Clienti-1.2.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Name unsigned release APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk EDIL-Clienti-1.2.0-release-unsigned.apk

      - name: Upload unsigned release APK for protected offline signing
        uses: actions/upload-artifact@v4
        with:
          name: EDIL-Clienti-1.2.0-release-unsigned
          path: EDIL-Clienti-1.2.0-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

      - name: Check protected signing secrets
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore protected release keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/ge360-release.jks

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          SIGNING_STORE_FILE: ge360-release.jks
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk EDIL-Clienti-1.2.0-release.apk

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EDIL-Clienti-1.2.0-release
          path: EDIL-Clienti-1.2.0-release.apk
          if-no-files-found: error
          retention-days: 30
